name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: StefanoDiPatti/vibe-deck
          path: dock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix dock/app --omit=dev
      - run: node scripts/build.js --check --dock dock/app
